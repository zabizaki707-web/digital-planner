<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>المخطط الرقمي</h1>
    </header>
    <main>
        <section id="planner">
            <h2>خططتك اليومية</h2>
            <div id="tasks">
                <h3>المهام</h3>
                <ul>
                    <li>مهمة 1</li>
                    <li>مهمة 2</li>
                    <li>مهمة 3</li>
                </ul>
            </div>
            <div id="notes">
                <h3>الملاحظات</h3>
                <textarea placeholder="اكتب ملاحظاتك هنا..."></textarea>
            </div>
        </section>
    </main>
    <footer>
        <p>حقوق الطبع والنشر © 2026</p>
    </footer>
</body>
</html>
